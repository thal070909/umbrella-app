server:
  port: 8080

umbrella:
  # 토스 미니앱(웹뷰)과 로컬 개발 서버에서 부를 수 있게 허용할 출처
  allowed-origins:
    - http://localhost:5173
  # 외부 공개 API에 보낼 앱 이름. 운영 시 연락처를 붙이려면 UMBRELLA_USER_AGENT로 바꾼다
  user-agent: ${UMBRELLA_USER_AGENT:umbrella-app/0.1}
  weather:
    base-url: https://api.open-meteo.com
    geocode-base-url: https://api.bigdatacloud.net
    # 같은 동네(약 1km 격자)는 10분 동안 같은 날씨를 돌려준다
    cache-ttl: 10m
  spots:
    # 공개 서버라 자주 느려진다. 세 곳에 동시에 보내고 가장 먼저 성공한 응답을 쓴다
    endpoints:
      - https://overpass-api.de/api/interpreter
      - https://overpass.kumi.systems/api/interpreter
      - https://overpass.private.coffee/api/interpreter
    # 사용자가 스피너를 이보다 오래 보지 않게 전체 대기 상한
    timeout: 8s
    cache-ttl: 30m
    # 세 곳이 모두 실패하면 이 시간 안에 받아 둔 결과라도 보여 준다
    stale-ttl: 24h
  kakao:
    # 카카오 디벨로퍼스 REST API 키. 비어 있으면 비 피하기 스팟도 OpenStreetMap으로 찾는다
    rest-api-key: ${KAKAO_REST_API_KEY:}
    base-url: https://dapi.kakao.com
    timeout: 5s
