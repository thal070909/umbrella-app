server:
  port: ${PORT:8080}
  # 배포 환경이 서버를 바꿔 끼울 때 처리 중인 요청은 마치고 내린다
  shutdown: graceful
  # 로드밸런서 뒤에서도 원래 사용자 IP를 알 수 있게 (요청 제한에 사용)
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # 외부 API(카카오·공공데이터) 상태는 넣지 않는다. 외부가 느려도 우리 서버는 살아 있다고 답해야 교체되지 않는다
      show-details: never

umbrella:
  # 토스 미니앱(웹뷰)과 로컬 개발 서버에서 부를 수 있게 허용할 출처
  allowed-origins:
    - http://localhost:5173
  # 한 사람(IP)이 1분에 보낼 수 있는 요청 수. 카카오·공공데이터 키 한도를 지킨다
  rate-limit-per-minute: ${UMBRELLA_RATE_LIMIT_PER_MINUTE:60}
  # 외부 공개 API에 보낼 앱 이름. 운영 시 연락처를 붙이려면 UMBRELLA_USER_AGENT로 바꾼다
  user-agent: ${UMBRELLA_USER_AGENT:umbrella-app/0.1}
  weather:
    base-url: https://api.open-meteo.com
    geocode-base-url: https://api.bigdatacloud.net
    # 같은 동네(약 1km 격자)는 10분 동안 같은 날씨를 돌려준다
    cache-ttl: 10m
  spots:
    # 공개 서버라 자주 느려진다. 세 곳에 동시에 보내고 가장 먼저 성공한 응답을 쓴다
    endpoints:
      - https://overpass-api.de/api/interpreter
      - https://overpass.kumi.systems/api/interpreter
      - https://overpass.private.coffee/api/interpreter
    # 사용자가 스피너를 이보다 오래 보지 않게 전체 대기 상한
    timeout: 8s
    cache-ttl: 30m
    # 세 곳이 모두 실패하면 이 시간 안에 받아 둔 결과라도 보여 준다
    stale-ttl: 24h
  kakao:
    # 카카오 디벨로퍼스 REST API 키. 비어 있으면 비 피하기 스팟도 OpenStreetMap으로 찾는다
    rest-api-key: ${KAKAO_REST_API_KEY:}
    base-url: https://dapi.kakao.com
    timeout: 5s
  shelter:
    # 재난안전데이터공유플랫폼(safetydata.go.kr) 인증키. 비어 있으면 무더위쉼터도 OpenStreetMap으로 찾는다
    service-key: ${SAFETYDATA_SERVICE_KEY:}
    base-url: https://www.safetydata.go.kr/V2/api
    service-id: DSSP-IF-10942
    page-size: 1000
    # 전국 쉼터를 받아 둔 파일. 서버를 다시 켜도 API 하루 한도를 쓰지 않고 바로 쓴다
    snapshot-path: ${SHELTER_SNAPSHOT_PATH:./data/shelters.json}
    # 받아 둔 지 이만큼 지나면 다시 받는다 (쉼터 지정은 자주 바뀌지 않음)
    refresh-after: 24h
