# PR과 main에 올라온 코드가 서버 테스트와 Docker 이미지 빌드를 통과하는지 확인한다
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 서버 테스트
        working-directory: server
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: Docker 이미지 빌드
        run: docker build -t umbrella-server:ci server
